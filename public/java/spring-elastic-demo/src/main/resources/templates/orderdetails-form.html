<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">


<head th:replace="~{fragments/head :: common-head('Embedded Frame')}"></head>

<body>

    <h2>Order details for <span th:text="|${customerId}#${orderNumber}|">CustomerId</span></h2>
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Line #</th>
                <th>Product Code</th>
                <th>Quantity</th>
                <th>Price Each</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="line : ${details}">
                <td th:text="${line.orderLineNumber}"></td>
                <td th:text="${line.productCode}"></td>
                <td>
                    <div style="display: flex; column-gap: 5px;">
                        <form
                            th:action="@{/orderdetails/update/{customerId}/{orderNumber}/{productCode}/{quantity}(customerId=${customerId},orderNumber=${orderNumber},productCode=${line.productCode},quantity=-1)}"
                            method="get" style="display: inline;">
                            <button type="submit" style="width: 50px;height:50px;">-</button>
                        </form>
                        <span th:text="${line.quantityOrdered}"
                            style="width:50px; height:50px;line-height: 50px;text-align: center;"></span>
                        <form
                            th:action="@{/orderdetails/update/{customerId}/{orderNumber}/{productCode}/{quantity}(customerId=${customerId},orderNumber=${orderNumber},productCode=${line.productCode},quantity=1)}"
                            method="get" style="display: inline;">
                            <button type="submit" style="width: 50px; height:50px;">+</button>
                        </form>
                    </div>
                </td>
                <td th:text="${line.priceEach}"></td>
            </tr>
        </tbody>
    </table>

</body>

</html>
