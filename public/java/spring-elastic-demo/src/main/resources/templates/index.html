<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: common-head('Spring - Elastic Search Demo')}"></head>

<body>

    <div class="container">
        <h1>Customers</h1>
        <div style="display: flex; gap: 20px;">
            <!-- Left Column: Customer Links -->
            <div style="width: 40%;">
                <ul>
                    <li th:each="c : ${customers}">
                        <!-- target matches the iframe name -->
                        <a th:href="@{/customers/{id}/orders(id=${c.customerNumber})}" target="orderFrame"
                            th:text="${c.customerName}">Customer</a>
                    </li>
                </ul>
            </div>

            <!-- Right Column: Embedded Orders Frame -->
            <div style="width: 60%;">
                <iframe name="orderFrame"
                    style="width: 100%; height: 100vh; border-left: 1px solid #ccc; padding-left: 5px; border-top: none; border-right: none; border-bottom: none;"
                    srcdoc="<!DOCTYPE html>
            <html>
              <head>
                <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css'>
              </head>
              <body class='container' style='display: grid; place-content: center; height: 100vh; text-align: center;'>
                <article>
                  <p class='secondary'>Please select a customer to view order details.</p>
                </article>
              </body>
            </html>">
                </iframe>
            </div>
        </div>
    </div>

</body>

</html>
