spring.application.name=demo
# Database connection URL, username, and password
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=password

# Optional: JDBC Driver (usually auto-detected by Spring Boot)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=classicmodels

# 2. Hibernate JPA Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# 3. Explicit Dialect (Fixes the HibernateException directly)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# --- Elasticsearch connection ---
# Adjust host/port/scheme to match your actual ES instance.
spring.elasticsearch.uris=http://localhost:9200

# Optional: connection/socket timeouts (defaults are usually fine for local dev)
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s
